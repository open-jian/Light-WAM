# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: lightwam
  - _self_

# 4 GPUs x batch 4 x accumulation 4 keeps global batch at 64.
batch_size: 4
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false
  history_memory:
    enabled: true
    min_size: 4
    max_size: 12
    raw_stride: 4

memory_monitor:
  enabled: true
  shuffled_probe_every: 500
  probe_batch_size: 2

wandb:
  project: LIBERO-Obj
  name: raw-frame-as-mem_${now:%Y-%m-%d_%H-%M-%S}

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 200

# training
gradient_accumulation_steps: 4
weight_decay: 1e-2
resume: null

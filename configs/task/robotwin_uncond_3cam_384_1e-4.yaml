# @package _global_

defaults:
  - override /data: robotwin
  - override /model: lightwam
  - _self_

# 4 GPUs x batch 4 x accumulation 4 keeps the original global batch at 64.
batch_size: 4
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false
  history_memory:
    enabled: true
    min_size: 4
    max_size: 12
    raw_stride: 4

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 5
max_steps: null
log_every: 10
save_every: 2500
eval_every: 500

# training
gradient_accumulation_steps: 4
weight_decay: 1e-2
resume: null

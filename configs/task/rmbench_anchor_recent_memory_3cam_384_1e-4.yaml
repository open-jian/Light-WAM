# @package _global_

defaults:
  - override /data: rmbench_anchor_recent_memory
  - override /model: lightwam
  - _self_

batch_size: 2
num_workers: 8

model:
  mot_checkpoint_mixed_attn: true
  history_memory:
    enabled: true
    mode: anchor_recent_fixed_slots_v1
    apply_to: action_branch_only
    min_size: 8
    max_size: 12
    raw_stride: 4
    anchor_size: 4
    anchor_stride: 4
    recent_min_size: 4
    recent_max_size: 8
    recent_stride: 4

lr_scheduler_type: cosine
learning_rate: 1e-4
num_epochs: 100
max_steps: 5000
log_every: 10
save_every: 1000
eval_every: 500

gradient_accumulation_steps: 4
weight_decay: 1e-2
resume: null

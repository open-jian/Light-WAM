# @package _global_

defaults:
  - train
  - override /task: rmbench_no_memory_3cam_384_1e-4
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  rmbench_root: /data2/jian/benchmark/RMBench/RMBench
  policy_name: lightwam_policy
  task_name: null
  task_config: demo_clean
  instruction_type: unseen
  eval_num_episodes: 100
  # Optional exact simulator seed for the first evaluated episode. When null,
  # RM-Bench keeps its official default: 100000 * (1 + seed).
  episode_seed_start: null
  output_dir: ./runs/rmbench_no_memory/eval/${now:%Y%m%d_%H%M%S}
  # Result-directory component passed to the official evaluator. Set this per
  # concurrent job to avoid its second-resolution output-directory collision.
  official_result_tag: null
  use_training_run_config: true
  training_config_path: null

  action_horizon: 32
  replan_steps: 24
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false
  timing_enabled: false
  skip_get_obs_within_replan: true
  # Diagnostic recording only; policy inputs and task success checks are unchanged.
  video_layout: multi_view

  dataset_stats_path: ./data/rmbench/dataset_stats.json
  device: cuda

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
